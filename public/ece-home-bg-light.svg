<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <pattern id="lightGridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="#f97316" fill-opacity="0.3" />
    </pattern>

    <linearGradient id="traceOrangeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="lightCenterGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1920" height="1080" fill="url(#bgLightGrad)" />
  <rect width="1920" height="1080" fill="url(#lightCenterGlow)" />
  <rect width="1920" height="1080" fill="url(#lightGridPattern)" />

  <!-- Central Processor Silhouette -->
  <g transform="translate(960, 480) scale(1.05)" opacity="0.3">
    <rect x="-140" y="-140" width="280" height="280" rx="16" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
    <rect x="-100" y="-100" width="200" height="200" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5" />
    <rect x="-50" y="-50" width="100" height="100" rx="4" fill="#ffffff" stroke="#c2410c" stroke-width="2" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">ECE SILICON</text>
  </g>

  <!-- Circuit Traces Left -->
  <g stroke="url(#traceOrangeLight)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80 160 L 320 160 L 440 280 L 680 280 L 780 380 L 820 380" />
    <path d="M 40 320 L 220 320 L 340 440 L 580 440 L 660 520 L 820 520" />
    <path d="M 120 520 L 280 520 L 400 640 L 700 640 L 820 580" />
    <path d="M 90 760 L 380 760 L 520 640 L 680 640" />
  </g>

  <!-- Circuit Traces Right -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1840 160 L 1600 160 L 1440 320 L 1240 320 L 1140 420" />
    <path d="M 1880 320 L 1660 320 L 1520 460 L 1320 460 L 1160 510" />
    <path d="M 1800 500 L 1560 500 L 1400 660 L 1220 660 L 1150 590" />
    <path d="M 1850 720 L 1540 720 L 1380 580 L 1180 580" />
  </g>

  <!-- Pads -->
  <g fill="#ea580c" fill-opacity="0.6">
    <circle cx="80" cy="160" r="4.5" />
    <circle cx="320" cy="160" r="3.5" />
    <circle cx="440" cy="280" r="3.5" />
    <circle cx="40" cy="320" r="4.5" />
    <circle cx="340" cy="440" r="4" />
    <circle cx="120" cy="520" r="4.5" />
    <circle cx="90" cy="760" r="4.5" />
  </g>

  <g fill="#0284c7" fill-opacity="0.5">
    <circle cx="1840" cy="160" r="4.5" />
    <circle cx="1600" cy="160" r="3.5" />
    <circle cx="1440" cy="320" r="3.5" />
    <circle cx="1880" cy="320" r="4.5" />
    <circle cx="1800" cy="500" r="4.5" />
    <circle cx="1850" cy="720" r="4.5" />
  </g>

  <!-- Specs -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" opacity="0.65">
    <text x="80" y="100">SYSTEM ARCHITECTURE: ARM / RISC-V</text>
    <text x="80" y="120">BUS: AXI4 PIPELINED INTERCONNECT</text>
    <text x="1620" y="80">RF: 2.4GHz BLE / WiFi 6E</text>
    <text x="1620" y="100">ADC: 16-BIT 200MSPS</text>
  </g>
</svg>
